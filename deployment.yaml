apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-app
  namespace: prod-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mini-app
  template:
    metadata:
      labels:
        app: mini-app
    spec:
      containers:
      - name: mini-app
        image: sumitjeswani/mini-app:v1
        ports:
        - containerPort: 3000
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 2
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mini-app-svc
  namespace: prod-lab
spec:
  selector:
    app: mini-app
  ports:
  - port: 80
    targetPort: 3000
